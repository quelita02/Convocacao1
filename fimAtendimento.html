<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atendimento finalizado — IMO GOV.BR</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>
    /* Estilos específicos desta tela */
    .main-content--centered {
      margin-left: 0;                 /* logout não usa sidebar */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logout-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--surface-rounder-lg);
      box-shadow: var(--shadow-2);
      padding: var(--spacing-scale-6);
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-scale-3);
    }
    .logout-icon { font-size: 48px; color: var(--color-success); }
    .logout-message { color: var(--color-text-secondary); }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Ir para o conteúdo principal</a>

  <!-- ══════════ HEADER ══════════ -->
  <header class="govbr-header" role="banner">
    <div class="header-brand">
      <button class="header-close-btn" id="mobile-menu-toggle" aria-label="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="header-logo">
        <svg class="govbr-logo-svg" viewBox="0 0 100 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon points="9,3.5 10.5,8.5 15.5,8.5 11.5,11.5 13,16.5 9,13.5 5,16.5 6.5,11.5 2.5,8.5 7.5,8.5" fill="#FFCD07"/>
          <text x="18" y="19" fill="#1351b4" font-family="Rawline,sans-serif" font-weight="700" font-size="14" letter-spacing="0.2">gov.br</text>
        </svg>
      </div>
      <div class="header-divider" aria-hidden="true"></div>
      <div class="header-system-info">
        <div class="header-system-name">IMO – Intermediação de Mão-de-Obra</div>
        <div class="header-system-subtitle">Ministério do Trabalho e Emprego</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="header-user">
        <span>Olá, João</span>
        <div class="header-avatar" aria-hidden="true">J</div>
      </div>
      <button class="header-icon-btn" aria-label="Notificações">
        <i class="fa-solid fa-bell"></i>
        <span class="notification-badge" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <!-- ══════════ CONTEÚDO ══════════ -->
  <main class="main-content main-content--centered" id="main-content" role="main">
    <div class="logout-card">
      <i class="fa-solid fa-circle-check logout-icon" aria-hidden="true"></i>
      <h1 class="page-title">Atendimento finalizado</h1>
      <p class="logout-message">O atendimento foi encerrado com sucesso.</p>
      <a href="lista-vagas.html" class="govbr-btn govbr-btn-primary">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        Iniciar novo atendimento
      </a>
    </div>
  </main>

</body>
</html>
