<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legenda — IMO GOV.BR</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>
    /* Página standalone: exibe o modal já aberto sobre fundo escurecido */
    body {
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: var(--font-base);
    }

    .page-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      z-index: 10;
    }

    .standalone-modal {
      background: var(--color-surface);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 20;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--color-gray-2);
    }

    .modal-title {
      font-size: var(--font-size-md);
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .modal-close-btn {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--border-radius-sm);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .modal-close-btn:hover {
      background: var(--color-gray-2);
      color: var(--color-text-primary);
    }

    .modal-body {
      padding: var(--space-5);
    }

    /* ── Alertas ────────────────────────────────────── */
    .legenda-alertas-title {
      font-size: var(--font-size-base);
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--space-4);
    }

    .legenda-items {
      display: flex;
      gap: var(--space-5);
      flex-wrap: wrap;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--color-gray-2);
    }

    .legenda-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      text-align: center;
      max-width: 120px;
    }

    .legenda-icon-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shield-icon {
      font-size: 36px;
      color: #b0b0b0;
    }

    .badge-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    .badge-dot-green { background: var(--color-success); }
    .badge-dot-red   { background: var(--color-danger); }

    .legenda-item-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      line-height: 1.35;
    }

    /* ── Ações ──────────────────────────────────────── */
    .legenda-acoes-title {
      font-size: var(--font-size-base);
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--space-3);
    }

    .legenda-acoes-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .legenda-acao {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .legenda-acao-icon {
      width: 28px;
      height: 28px;
      background: var(--color-primary);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      flex-shrink: 0;
    }

    .legenda-acao-circle {
      width: 28px;
      height: 28px;
      border: 2px solid var(--color-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
      font-size: 13px;
      flex-shrink: 0;
    }

    .legenda-acao-label {
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Overlay + Modal centralizados -->
  <div class="page-overlay" id="page-overlay" role="dialog" aria-modal="true" aria-labelledby="leg-modal-title">

    <div class="standalone-modal" role="document">

      <!-- Cabeçalho -->
      <div class="modal-header">
        <h1 class="modal-title" id="leg-modal-title">Legenda</h1>
        <button class="modal-close-btn"
                id="btn-fechar"
                aria-label="Fechar legenda">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Corpo -->
      <div class="modal-body">

        <!-- ── Seção Alertas ─────────────────────────── -->
        <h2 class="legenda-alertas-title">Alertas</h2>
        <div class="legenda-items">

          <!-- Monitorado pelo SD -->
          <div class="legenda-item">
            <div class="legenda-icon-wrap">
              <i class="fa-solid fa-shield shield-icon"></i>
              <span class="badge-dot badge-dot-green" aria-hidden="true"></span>
            </div>
            <span class="legenda-item-label">Monitorado pelo seguro desemprego</span>
          </div>

          <!-- Não monitorado pelo SD -->
          <div class="legenda-item">
            <div class="legenda-icon-wrap">
              <i class="fa-solid fa-shield shield-icon"></i>
              <span class="badge-dot badge-dot-red" aria-hidden="true"></span>
            </div>
            <span class="legenda-item-label">Não monitorado pelo seguro desemprego</span>
          </div>

          <!-- Trabalhador prioritário -->
          <div class="legenda-item">
            <div class="legenda-icon-wrap">
              <span style="background:var(--color-primary);color:#fff;font-weight:700;font-size:13px;width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;">P</span>
            </div>
            <span class="legenda-item-label">Trabalhador prioritário</span>
          </div>

          <!-- Recomendado pelo EmpregaAI -->
          <div class="legenda-item">
            <div class="legenda-icon-wrap">
              <span style="background:var(--color-success-bg);color:var(--color-success);border:1.5px solid var(--color-success);font-weight:700;font-size:10px;padding:2px 7px;border-radius:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;">
                <i class="fa-solid fa-robot" style="font-size:9px;"></i> IA
              </span>
            </div>
            <span class="legenda-item-label">Recomendado pelo EmpregaAI</span>
          </div>

        </div>

        <!-- ── Seção Ações ───────────────────────────── -->
        <h2 class="legenda-acoes-title">Ações</h2>
        <div class="legenda-acoes-list">

          <!-- Ação 1: Conferir detalhes -->
          <div class="legenda-acao">
            <div class="legenda-acao-icon" aria-hidden="true">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <span class="legenda-acao-label">Conferir detalhes do batimento trabalhador x vaga</span>
          </div>

          <!-- Ação 2: Visualizar cadastro -->
          <div class="legenda-acao">
            <div class="legenda-acao-circle" aria-hidden="true">
              <i class="fa-solid fa-user"></i>
            </div>
            <span class="legenda-acao-label">Visualizar cadastro do trabalhador</span>
          </div>

        </div>

      </div>

    </div><!-- /standalone-modal -->
  </div><!-- /page-overlay -->

  <script>
    'use strict';

    const btnFechar = document.getElementById('btn-fechar');

    /* Fechar modal volta para página anterior */
    btnFechar.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'visualizar-vaga.html';
      }
    });

    /* Fechar com ESC */
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') btnFechar.click();
    });

    /* Foco acessível no botão fechar ao carregar */
    document.addEventListener('DOMContentLoaded', () => {
      btnFechar.focus();
    });
  </script>
</body>
</html>
